---
layout: default
---
<section class="k-section k-section--post">
	<div class="k-container">
		<article class="k-card k-post">
			<p class="k-post-meta">
				{{ page.date | date: "%B %-d, %Y" }}
				{% if page.tags and page.tags.size > 0 %} &middot; {{ page.tags | join: ", " }}{% endif %}
			</p>
			<h1>{{ page.title }}</h1>
			<div class="k-post-content">
				{{ content }}
			</div>
			<p class="k-back-wrap"><a class="k-back" href="{{ '/' | relative_url }}">&larr; Back to all posts</a></p>
		</article>
	</div>
</section>
